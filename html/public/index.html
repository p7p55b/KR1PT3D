<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kr1pt3d-unstable</title>

<style>
:root {
    --bg: #545e60;
    --fg: #ebe6ca;
    --mid: #162326;
    --acc: #97b1aa;
    --lnclr: #cdccb2;
    --pane-bg: #2a3536;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, sans-serif;
    background-color: var(--bg);
    color: var(--fg);
}

header {
    padding: 14px 18px;
    background: var(--mid);
    border: 1px solid var(--lnclr);
    color: var(--fg);
    font-weight: 600;
}

main {
    padding: 16px;
    display: flex;
    gap: 16px;
    align-items: flex-start;
    flex-wrap: wrap;
}

.slctppl {
    flex: 1 1 220px;
    min-width: 200px;
    min-height: 300px;
    border: 1px solid var(--lnclr);
    border-radius: 3px;
    padding: 12px;
    background-color: var(--pane-bg);
}

.pane {
    flex: 3 1 480px;
    min-width: 280px;
    border-radius: 3px;
    padding: 12px;
    background-color: var(--pane-bg);
    color: var(--fg);

    display: flex;
    flex-direction: column;
    height: 80vh;
}

.row {
    display: flex;
    gap: 8px;
    border: 1px solid var(--lnclr);
    border-radius: 3px;
    align-items: center;
    margin-bottom: 8px;
    flex-wrap: wrap;
    padding: 6px;
}

.row label {
    white-space: nowrap;
}

input,
button {
    padding: 8px 12px;
    border-radius: 3px;
    border: 1px solid var(--mid);
    background: transparent;
    color: inherit;
}

input[type="text"] {
    flex: 1;
    min-width: 120px;
}

button {
    background: var(--mid);
    color: var(--fg);
    cursor: pointer;
    border-color: var(--mid);
    white-space: nowrap;
    transition: filter .2s ease;
}

button:hover:not(:disabled) {
    filter: brightness(1.15);
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.msgs {
    flex: 1;
    min-height: 250px;

    border: 1px solid var(--lnclr);
    border-radius: 3px;
    padding: 8px;
    overflow: auto;
    background-color: var(--mid);

    scrollbar-width: thin;
}

.from {
    font-weight: 600;
    margin-right: 6px;
    color: var(--acc);
}

.status {
    font-size: 12px;
    opacity: 0.8;
    margin-bottom: 6px;
}

details {
    margin-top: 10px;
}

pre {
    background: rgb(0, 29, 126);
    padding: 8px;
    border-radius: 6px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
}

#version {
    position: fixed;
    bottom: 10px;
    left: 0;
    width: 100%;
    text-align: left;
    font-size: 14px;
    color: gray;
    padding-left: 16px;
}

@media (max-width: 900px) {
    main {
        flex-direction: column;
    }

    .slctppl,
    .pane {
        width: 100%;
        min-height: auto;
    }

    .msgs {
        max-height: 50vh;
    }
}

@media (max-width: 480px) {
    header {
        font-size: 14px;
        padding: 10px 12px;
    }

    main {
        padding: 10px;
        gap: 10px;
    }

    .row {
        flex-direction: column;
        align-items: stretch;
    }

    input,
    button {
        width: 100%;
    }

    #connect-row {
        flex-direction: row;
        flex-wrap: wrap;
    }
}
</style>
</head>

<body>

<header id="header-title">
    kr1pt3d - private secure chat
</header>

<main>

    <section class="slctppl">
        <strong>Other chats</strong>
        <div style="margin-top:10px; opacity:.7;">
            (will be added soon I hope)
        </div>
    </section>

    <section class="pane">

        <div class="row">
            <label for="room">Room ID :</label>
            <input
                id="room"
                type="text"
                autocomplete="off"
                placeholder="ex: demo-room"
                value="demo-room">
        </div>

        <div class="row">
            <label for="user">Username :</label>
            <input
                id="user"
                type="text"
                autocomplete="username"
                placeholder="Choose a username">
        </div>

        <div class="row">
            <label for="peer">Peer :</label>
            <input
                id="peer"
                type="text"
                autocomplete="off"
                placeholder="Enter your friend's ID">
        </div>

        <div class="row" id="connect-row">
            <button id="connect">Connect</button>
            <div class="status" id="status">Offline</div>
        </div>

        <div class="msgs" id="log"></div>

        <div class="row">
            <label for="input">Message :</label>
            <input
                id="input"
                type="text"
                placeholder="Your message"
                disabled>
            <button id="send" disabled>Send</button>
        </div>

        <details>
            <summary>Debug informations</summary>
            <pre id="debug"></pre>
        </details>

    </section>

</main>

<div id="version">
    Version : chargement...
</div>

<script src="app.js"></script>

<script>
fetch("version.txt")
    .then(response => response.text())
    .then(data => {
        const version = data.trim();

        document.getElementById("version").textContent =
            "Version : " + version;

        document.getElementById("header-title").textContent =
            "kr1pt3d - private secure chat - v" + version;
    })
    .catch(error => {
        document.getElementById("version").textContent =
            "Version : read error";

        console.error(error);
    });
</script>

</body>
</html>
