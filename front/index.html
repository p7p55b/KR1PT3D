<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kr1pt3d-unstable</title>

<style>
:root {
    --bg: #545e60;
    --fg: #ebe6ca;
    --mid: #162326;
    --acc: #97b1aa;
    --lnclr: #cdccb2;
    --pane-bg: #2a3536;
}

* {
    box-sizing: border-box;
}

html, body {
    min-height: 100%;
}

body {
    margin: 0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, sans-serif;
    background-color: var(--bg);
    color: var(--fg);
}

header {
    flex-shrink: 0;
    padding: 14px 18px;
    background: var(--mid);
    border-bottom: 1px solid var(--lnclr);
    color: var(--fg);
    font-weight: 600;
}

main {
    flex: 1;
    display: flex;
    gap: 16px;
    padding: 16px;
    min-height: 0;
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
}

.slctppl {
    flex: 0 0 240px;
    border: 1px solid var(--lnclr);
    border-radius: 3px;
    padding: 12px;
    background-color: var(--pane-bg);
}

.pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    border-radius: 3px;
    padding: 12px;
    background-color: var(--pane-bg);
    color: var(--fg);
}

.row {
    display: flex;
    gap: 8px;
    border: 1px solid var(--lnclr);
    border-radius: 3px;
    align-items: center;
    margin-bottom: 8px;
    padding: 6px;
}

.row label {
    white-space: nowrap;
    min-width: 80px;
}

input,
button {
    padding: 8px 12px;
    border-radius: 3px;
    border: 1px solid var(--mid);
    background: transparent;
    color: inherit;
    font-family: inherit;
    font-size: 14px;
}

input[type="text"] {
    flex: 1;
    min-width: 0;
}

input[type="text"]:focus {
    outline: 1px solid var(--acc);
}

button {
    background: var(--mid);
    color: var(--fg);
    cursor: pointer;
    border-color: var(--mid);
    white-space: nowrap;
    transition: filter .2s ease;
}

button:hover:not(:disabled) {
    filter: brightness(1.15);
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

#connect-row {
    justify-content: space-between;
}

.msgs {
    flex: 1;
    min-height: 250px;
    border: 1px solid var(--lnclr);
    border-radius: 3px;
    padding: 8px;
    overflow-y: auto;
    background-color: var(--mid);
    scrollbar-width: thin;
    overflow-anchor: auto;
}

.msg {
    padding: 4px 2px;
    display: flex;
    align-items: flex-start;
    gap: 6px;
}

.msg-body {
    flex: 1;
    min-width: 0;
    word-break: break-word;
    overflow-wrap: anywhere;
}

.msg-content {
    display: block;
    word-break: break-word;
    overflow-wrap: anywhere;
}

.msg-content.peer {
    background-color: rgba(151, 177, 170, 0.15);
    padding: 6px 8px;
    border-radius: 3px;
}

.from {
    font-weight: 600;
    margin-right: 6px;
    color: var(--acc);
}

.msg-reply-quote {
    border-left: 2px solid var(--acc);
    padding-left: 6px;
    font-size: 12px;
    opacity: .75;
    margin-bottom: 2px;
    cursor: pointer;
    word-break: break-word;
    overflow-wrap: anywhere;
}

.reply-btn {
    padding: 4px 6px;
    opacity: .6;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.reply-btn:hover {
    opacity: 1;
}

#reply-preview {
    display: none;
    border-left: 3px solid var(--acc);
    background: var(--mid);
    padding: 6px 10px;
    margin-bottom: 8px;
    border-radius: 3px;
    font-size: 13px;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
}

#reply-preview-text {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

#reply-cancel {
    padding: 2px 6px;
    font-size: 12px;
    flex-shrink: 0;
}

.status {
    font-size: 12px;
    opacity: 0.8;
}

details {
    margin-top: 8px;
    font-size: 13px;
}

summary {
    cursor: pointer;
    user-select: none;
}

pre {
    background: rgb(0, 29, 126);
    padding: 8px;
    border-radius: 3px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
    margin: 6px 0 0;
    font-size: 12px;
}

#version {
    flex-shrink: 0;
    padding: 8px 16px;
    font-size: 12px;
    color: var(--lnclr);
    opacity: 0.7;
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
}

@media (max-width: 900px) {
    main {
        flex-direction: column;
        padding: 12px;
        gap: 12px;
    }

    .slctppl {
        flex: 0 0 auto;
        width: 100%;
        min-height: auto;
        padding: 10px;
    }

    .pane {
        width: 100%;
        min-height: auto;
    }

    .msgs {
        min-height: 280px;
        height: 50vh;
    }
}

@media (max-width: 600px) {
    header {
        padding: 10px 12px;
        font-size: 14px;
    }

    main {
        padding: 8px;
        gap: 8px;
    }

    .pane {
        padding: 8px;
    }

    .row {
        padding: 4px 6px;
        margin-bottom: 6px;
        gap: 6px;
    }

    .row label {
        font-size: 13px;
        min-width: 75px;
    }

    input,
    button {
        font-size: 16px;
    }

    .send-row label {
        display: none;
    }

    .send-row input[type="text"] {
        flex: 1;
        min-width: 0;
    }

    .send-row button {
        flex: 0 0 auto;
        padding: 8px 14px;
    }

    .msgs {
        min-height: 220px;
        height: 45vh;
        padding: 6px;
    }

    #version {
        padding: 6px 8px;
        font-size: 11px;
    }
}
</style>
</head>

<body>

<header id="header-title">
    kr1pt3d - private secure chat
</header>

<main>

    <section class="slctppl">
        <strong>Other chats</strong>
        <div style="margin-top:10px; opacity:.7;">
            (will be added soon I hope)
        </div>
    </section>

    <section class="pane">

        <div class="row">
            <label for="room">Room ID :</label>
            <input
                id="room"
                type="text"
                autocomplete="off"
                placeholder="ex: demo-room"
                value="demo-room">
        </div>

        <div class="row">
            <label for="user">Username :</label>
            <input
                id="user"
                type="text"
                autocomplete="username"
                placeholder="Choose a username">
        </div>

        <div class="row">
            <label for="peer">Peer :</label>
            <input
                id="peer"
                type="text"
                autocomplete="off"
                placeholder="Enter your friend's ID">
        </div>

        <div class="row" id="connect-row">
            <button id="connect">Connect</button>
            <div class="status" id="status">Offline</div>
        </div>

        <div class="msgs" id="log"></div>

        <div id="reply-preview">
            <span id="reply-preview-text"></span>
            <button id="reply-cancel">✕</button>
        </div>

        <div class="row send-row">
            <label for="input">Message :</label>
            <input
                id="input"
                type="text"
                placeholder="Your message"
                disabled>
            <button id="send" disabled>Send</button>
        </div>

        <details>
            <summary>Debug informations</summary>
            <pre id="debug"></pre>
        </details>

    </section>

</main>

<div id="version">
    Version : chargement...
</div>

<script src="app.js"></script>

<script>
fetch("version.txt")
    .then(response => response.text())
    .then(data => {
        const version = data.trim();

        document.getElementById("version").textContent =
            "Version : " + version;

        document.getElementById("header-title").textContent =
            "kr1pt3d - private secure chat - v" + version;
    })
    .catch(error => {
        document.getElementById("version").textContent =
            "Version : read error";

        console.error(error);
    });
</script>

</body>
</html>
